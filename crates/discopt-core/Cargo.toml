[package]
name = "discopt-core"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core MINLP solver: B&B engine, expression IR, presolve"

[dependencies]
# feral: pure-Rust sparse linear algebra. Provides the unsymmetric LU basis
# engine (ftran/btran + product-form column updates) that backs the warm-started
# simplex node engine for MILP.
#
# Floor is 0.11.3 — do NOT downgrade below it. 0.11.3 is the first crates.io
# release carrying the issue-#89 fix (`u_above` reindex, O(m³)→O(m²) on many-row
# bases). Earlier 0.11.x (≤0.11.2) lack it: #341 used `feral = "0.11"`, picked up
# 0.11.2, and silently regressed set-covering from ~3s to a >30s timeout
# (sc2000/sc4000) — the LU refactor went quadratic→cubic in the row count,
# invisible on few-row knapsacks but catastrophic on 800–1500-row covering LPs.
# `test_setcover_lp_regression.py` guards against a re-downgrade.
#
# 0.12.0 was the first crates.io release carrying the discopt#364 LU-hardening APIs
# (feral #93/#94/#95) the numeric-focus simplex consumes: the element-growth
# getters (growth()/u_max0()), the unsymmetric-LU condition estimate
# (condition_estimate_1), and the richer update() instability signal
# (RefactorCause + last_refactor() + growth-aware/dense-parity should_refactor).
#
# 0.14.0 is the first crates.io release carrying feral #112 / PR #113 (previously
# git-rev-pinned at merge commit 660224dc9299, unreleased at the time): the sparse
# Forrest–Tomlin bump update now accumulates its working row with an always-on
# Neumaier (Kahan–Babuška) compensated sum, which keeps the sparse LU factor
# accurate on the wide dense-McCormick node bases. This bump replaces that temporary
# git rev with the tagged release, as the pin comment instructed.
#
# WHY THIS MATTERS FOR THE #557 density-aware LU route (linsolve.rs): the route
# sends the m∈(16,256] sparse-but-wide McCormick bases to feral's SPARSE LU instead
# of the dense O(m³) path. On plain feral 0.12 that eliminates the RefacFtTinyPivot
# refactor storm (storm-elimination IS feral-independent, 42337→~3200 on st_e36) —
# BUT the plain-0.12 sparse factor is not accurate enough for the dual bound to keep
# closing: st_e36 with the route ON drops optimal→feasible, its bound stuck at the
# root value −304.5 (vs −246.02 that certifies optimal). #112's compensated sparse
# accumulation (carried by 0.14.0) restores the bound-closing, so route ON stays
# `optimal` — this is the acceptance test for the bump. No discopt API change
# (LuParams gains `update_pivot_search: bool`, default false, covered by
# `..LuParams::default()`).
#
# 0.15.1 is the current floor. discopt consumes ONLY feral's LU layer
# (`SparseLu`/`DenseLu`/`SparseColMatrix`/`SparseLuSymbolic`/`LuParams`/
# `RefactorCause`/`FeralError` in linsolve.rs) — none of the multifrontal or
# profiler surface — which is what makes this bump source-compatible despite
# 0.15.0 being a BREAKING release in its diagnostic API (`SupernodeTiming`
# `us` → `ns`, `BucketStats::sum_us`/`avg_us` → `*_ns`, `ProfileReport::loop_us`
# → `loop_ns`). Verified by grep: the repo's only feral references are
# `RefactorCause` and `FeralError`.
#
# What 0.15.0 buys the node engine is dense-kernel throughput. The packed BLAS-3
# trailing update is now an explicit pulp SIMD kernel and the x86_64 pulp
# dispatch helpers route through `Simd::vectorize`; previously the lane ops
# executed as outlined calls (~10x kernel slowdown on x86, invisible on aarch64
# where NEON is baseline). Upstream reports byte-exact results at every SIMD
# width, enforced by parity tests plus hardcoded golden bit-digests
# (`tests/golden_bits.rs`, recorded on x86_64 and passing unmodified on
# aarch64). Separately, four tuning-knob `env::var` lookups that sat on the
# per-panel dispatch path are now read once via `OnceLock` (upstream paired A/B:
# −5.7% HYDCAR20, −9.0% block-tridiagonal chain). That is per-front FIXED cost,
# so it lands hardest on many-small-front bases — precisely the regime the
# per-node simplex basis lives in.
#
# 0.15.1 itself is a patch release whose four items (MC64 scaling-cache gate
# widening, a bit-identical Hungarian-matching heap, the post-amalgamation
# `Supernode.nrow` undercount, and `Solver::new()` deriving `use_parallel` from
# `available_parallelism()` instead of hardcoding `true`) all sit on the
# multifrontal side discopt does not call. It is pinned exactly anyway because
# POUNCE 0.10.0's workspace pins feral 0.15.1, and holding discopt and POUNCE on
# one feral release keeps a single LU implementation behind both the simplex
# node engine and the NLP evaluator.
#
# ACCEPTANCE. Which CLAUDE.md §5 regime applies depends on what the bump CLAIMS.
#
#   (a) A bump that claims arithmetic neutrality — diagnostics, the multifrontal
#       side discopt does not call, a parameterization whose default discopt
#       passes unchanged — is BOUND-NEUTRAL: `status`, `node_count` and the
#       certified `objective` must be EXACTLY unchanged on a certifying panel,
#       and any drift, even an apparent improvement, means the bump is wrong.
#   (b) A bump that REPLACES a numeric kernel — a different pivoting rule, a
#       different ordering, a different factorization — cannot be held to (a):
#       a different rounding trajectory reshuffles degenerate pivot choices, so
#       node counts move by construction and (a) would forbid ever adopting a
#       better LU. It is BOUND-CHANGING and takes that regime's pair instead:
#       cert-clean (no status regression, no bound above its reference optimum,
#       objectives within abs 1e-6 / rel 1e-4, no certification regression) AND
#       net-positive on an instrument that can actually SEE the change. The
#       certifying panel cannot: `docs/dev/baron-gap-plan.md` §1.3 puts node-LP
#       at 0.06% of its wall, so it shows a kernel bump's rounding cost and none
#       of its benefit. Net-positive for an LU bump is measured on the captured
#       relaxation LPs, counter-based (`LuFactorNnz`/`LuBasisNnz`).
#
# This split was written when 0.16.0 forced it; the (a) text below is the record
# of the 0.15.1 bump, which was a genuine (a).
#
# MEASURED under (a), 49-instance cert panel, same
# machine, arms built from the same source and distinguished by the `feral-<ver>`
# string cargo bakes into the `_rust` extension: 49/49 rows bit-identical in
# status, node_count AND objective (0.14.0+pounce 0.9.0 -> 0.15.1+pounce 0.10.0).
# A same-build repeat ran first as the determinism control — also 49/49
# bit-identical — so node equality is a real gate here and not an artifact of a
# panel that never varies. Do NOT judge this bump against the committed
# `docs/dev/data/cert-baseline.jsonl`: that reference is stale against `main`
# (18 violations on an UNMODIFIED tree on a POUNCE-equipped machine), which is
# why the arms are diffed against each other instead.
#
# 0.16.0 is the current pin (#1008). It is a BREAKING release whose one breaking
# item is the default this bump is taken for: `SparseLu::factor` now pivots with
# threshold Markowitz (feral #171/#172) instead of AMD-on-AtA plus Gilbert-Peierls.
# Markowitz chooses its column order DURING factorization, so it ignores the
# `symbolic` argument beyond a dimension check; `LuPivoting::GilbertPeierls`
# restores the old rule. discopt keeps the new default at both call sites.
#
# WHY: #1008 attributed 72.6% of LP wall to `LuNumeric` and named FILL as the
# lever (docs/dev/performance-plan.md §18f, as corrected by §18g). Markowitz is a
# direct attack on fill: upstream's 16-basis corpus reports `factor_nnz/nnz(B)`
# geomean 2.77x -> 1.06x, never worse on any basis, faster on 15 of 16, best case
# 1066.64ms -> 10.98ms (`QPLIB_1451_rlt0_cap100000`, fill 24.90x -> 1.14x). It
# supersedes the Suhl-Suhl peel this branch previously shipped behind
# `DISCOPT_LU_TRIANGULARIZE`: the peel had to trade a lost dual bound on
# bchoco06 for its speedup (feral #163/#168, §18h), where Markowitz gets both.
# That flag and its `dense_bump_max_dim` pairing are REMOVED here rather than
# kept alive with a `GilbertPeierls` pin -- under the new default the peel is
# ignored and its `used_dense_bump()` non-vacuity counter could only ever read 0,
# which is the dead flag CLAUDE.md §3 forbids and the vacuous instrument §6 does
# (§18i records the audit; shipped code had no other exposure).
#
# SAFE ON THE SILENT-SUBSTITUTION HAZARD: both `SparseLu::factor` sites pass a
# throwaway `SparseLuSymbolic::analyze`, not a deliberately chosen AMD/METIS/AMF
# ordering, so there is no ordering for Markowitz to discard. Nothing asserts
# `reach_visits()` (Gilbert-Peierls-only, returns 0 under Markowitz) or
# `used_dense_bump()`, and no test pins a pivot row or permutation. Source-
# compatible: `FeralLU::params()` builds with `..LuParams::default()`, so the new
# `LuParams::pivoting` field is not a build break.
#
# ACCEPTANCE: see the bound-neutral regime stated above. MEASURED FOR THIS BUMP:
# MEASURED FOR THIS BUMP under (b), both gates, arms
# distinguished by the `feral-<ver>` string cargo bakes into the extension and
# each asserting the OTHER arm's marker absent:
#
#   cert-clean   PASS. 52-instance certifying panel, 103 checks, 0 violations,
#                51 oracle-backed against `minlplib.solu`. No `optimal` instance
#                left `optimal`, no dual bound above its reference optimum, every
#                objective inside tolerance. 47 of 52 node counts bit-identical;
#                the 5 that moved (nvs02 345->421, nvs14 129->839, nvs11, nvs12,
#                tanksize) are rounding-trajectory drift, +1.3% in total, and are
#                the expected (b) cost, not a defect.
#   net-positive PASS, decisively, on the instrument that can see it. 82 captured
#                relaxation LPs: aggregate fill 8.32x -> 1.28x, factor nonzeros
#                4,597,979,997 -> 836,938,845 (-81.8%), better on 58 LPs, worse on
#                18, within 1% on 6. 144 of 144 arm x LP objectives at the HiGHS
#                optimum. Wall 2751.9s -> 493.0s is consistent but NOT a claim:
#                the arms ran concurrently with unequal contention (§9).
#
# ROBUSTNESS, the column to read next to fill: status changes are symmetric, one
# each way. QPLIB_2480_rlt1 regresses `optimal` -> `numerical` (fill was already
# 1.03x, so Markowitz had nothing to win there and only moved the trajectory);
# QPLIB_1675_rlt1 goes `numerical` -> `optimal` with fill 12.84x -> 2.00x and
# wall 446.56s -> 35.42s; QPLIB_2823_rlt1 moves `numerical` -> `iter_limit`, both
# non-solutions. Cold primal fallbacks 28 -> 30 across 82 LPs. `numerical` is a
# refusal, not a false answer, and neither arm produced a false verdict in 144
# comparisons — but the cold path is the one §18b/§18c measured returning false
# `Unbounded`/`Numerical`, so this count is the thing to watch on the next bump.
#
# This restores a crates.io version requirement, ending the git-rev pin the
# previous paragraph carried (e00aa706, feral PR #162) and with it the two-copy
# build; POUNCE 0.10.0 pins feral 0.15.1, so the shared-release alignment noted
# above returns as soon as POUNCE follows to 0.16.0.
#
# RETRACTION (#1134, 2026-08-31, CLAUDE.md §11), narrow. The (b) paragraph above
# asserts that "the certifying panel cannot" see an LU kernel bump, and so measures
# net-positive only on the captured relaxation LPs. It cannot see the BENEFIT --
# that part stands -- but it does see a per-node COST that this record does not
# carry. Measured on `main`, interleaved A/B, 3 reps, arms differing only in
# `LuParams::pivoting` and distinguished by a marker string baked into the
# extension, restricted to instances that are NOT auto-routed and whose node count
# is identical in both arms (so the comparison is per-node cost, not search) --
# wall in seconds, Markowitz / GilbertPeierls:
#
#   nvs09  2.78/2.65   st_e29 2.07/2.03   ex1224 2.03/2.00   ex1225 1.88/1.84
#   gkocis 1.35/1.39   ex1226 1.53/1.35   oaer   1.32/1.32   st_e36 6.83/7.03
#   nvs22 15.35/12.11  nvs05 >=60.32/56.62  (the Markowitz arm censored at 60 s)
#
# Median ratio ~1.03. Two rows carry it: `nvs22` +27%, and `nvs05` >=+7%, which is
# enough to lose a certification 3/3 reps that the GilbertPeierls arm holds at
# 56.6 s (sd 1.35) -- one of the three #1134 reports lost. It is two-sided: on the
# routed `m3` Markowitz is 2.4x FASTER (1.53 s vs 3.70 s). The shape is expected --
# Markowitz chooses its column order DURING factorization, and on the panel's small
# low-fill bases that search has little to amortize against, while the 0.16.0 win
# (fill 8.32x -> 1.28x) is measured on large high-fill QPLIB relaxation bases.
#
# The bump is NOT retracted: fill, `numerical` refusals and wall on the LPs that
# dominate a real solve all improved, and no verdict was ever false. What is
# retracted is the claim that this panel is blind to the change, and with it the
# assumption that a kernel bump needs no wall measurement at panel scale.
#
# WITHDRAWN from this evidence: `cvxnonsep_nsig30`, which a first pass under #1134
# read as +49% from pivoting. It is auto-routed to the `oa` master on `main`, where
# the route runs to a wall-clock budget checkpoint before abstaining, so a wall
# difference there is not a per-factorization measurement. Its real regression
# bisects to `533c05e1` (PR #1100), not to this bump -- see
# docs/dev/certification-gap-plan.md §0.6.1, Cause 2.
#
# FOLLOW-UP: size-routed pivoting (GilbertPeierls below a basis-size/fill
# threshold, Markowitz above) is the general fix and the numbers above are its
# entry measurement. Not taken here -- it is a bound-changing default and owes the
# CLAUDE.md §5 graduation pair on a machine that can run it.
feral = "0.16.0"
# rayon: data-parallel iterators. Used (behind the `parallel` feature) to solve
# the independent per-node LP relaxations of a B&B batch concurrently. Pinned to
# 1.10 to keep the crate's MSRV (1.75); 1.12+ requires rustc 1.80.
rayon = { version = "1.10", optional = true }
# libm: portable libm implementation. Provides erf() (and other special
# functions) absent from Rust's std f64, used to evaluate the Gauss error
# function in the expression IR. Pure-Rust, preserves clean-wheel builds.
libm = "0.2"

[features]
# Parallel node evaluation in the MILP B&B driver via rayon. On by default
# (benchmarks show ~3.7x on 4 cores with an identical, deterministic tree);
# build with `--no-default-features` for the reference serial path.
default = ["parallel"]
parallel = ["dep:rayon"]
