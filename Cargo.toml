[workspace]
members = ["crates/discopt-core", "crates/discopt-python"]
resolver = "2"

[workspace.package]
edition = "2021"
# Measured floor, not aspirational: 1.75 and 1.80 fail on `rayon 1.12` (needs 1.80)
# and on `&raw` (stabilized 1.82); 1.82/1.83 fail inside `pulp`. 1.84 is the first
# toolchain that builds `cargo check --workspace` clean, and matches the README.
rust-version = "1.84"
license = "EPL-2.0"
repository = "https://github.com/jkitchin/discopt"

[workspace.dependencies]
# abi3-py312 builds against CPython's stable ABI, so ONE wheel per platform
# covers every supported interpreter. The floor must track `requires-python` in
# pyproject.toml -- if that moves to >=3.13, this becomes abi3-py313.
# `.github/scripts/check_wheel_coverage.py` fails the release if the two drift.
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py312"] }
numpy = "0.23"
