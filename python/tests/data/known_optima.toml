# ── LP-node engine scope (issue #862) — the vendored pure-integer MINIMIZE
# instances the LP-per-node spatial engine (``_relax/lp_spatial_bb.py``) serves, and
# therefore the corpus on which the #844 fallback's *incumbent quality* is scored by
# ``discopt_benchmarks/scripts/issue844_primal_quality_panel.py``.
#
# Values are not new: each is an oracle already carried in this repo, consolidated
# here so the panel reads one registry instead of an 18th private ``OPT = {...}``
# dict. ``source`` records the in-repo constant it was taken from; all trace back to
# minlplib.solu.
#
# ``status`` follows this file's existing convention — what a full ``Model.solve()``
# does today — and is the measured outcome of the #862 panel at a 20 s budget with
# DISCOPT_LP_SPATIAL_FALLBACK on (results/issue862/quality_panel_vendored_20s.json,
# 2026-07-26). It is NOT a statement about the LP-node engine in isolation; for that,
# and for why nvs17/19/24 defeat its primal heuristics, see
# docs/dev/lp-node-primal-quality.md.
#
# nvs18, nvs23 and prob02 are in scope for the engine but no in-repo source records
# an optimum for them, so they are deliberately absent: the panel reports them as
# UNSCORED rather than scoring them against a guess.

