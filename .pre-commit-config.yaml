repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff
        # Scope to the library/tests exactly like CI's `ruff check python/`
        # (CI runs this hook). Excludes benchmarks, one-off scripts, docs
        # notebooks, etc. — none of which CI lints today.
        args: [--fix]
        files: ^python/
      - id: ruff-format
        files: ^python/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        # Single source of truth for the typecheck: the same mypy version, import
        # deps, and whole-package scope CI uses (CI runs this very hook). mypy
        # errors are cross-file, so run on the whole package, not per changed file.
        files: ^python/discopt/
        pass_filenames: false
        # Pinned, not floating. Unpinned stub packages made CI a function of
        # the upstream release calendar: numpy 2.5 (which needs Python 3.12)
        # shipped a `type` statement in its stubs, and every PR went red at
        # `numpy/__init__.pyi:737: Type statement is only supported in Python
        # 3.12 and greater` without a line of repo code changing. Bump these
        # deliberately, with the typecheck re-run, rather than by surprise.
        additional_dependencies:
          - numpy==2.5.2
          - scipy==1.18.0
          - jax==0.11.1
          - jaxlib==0.11.1
        args: [python/discopt/, --ignore-missing-imports]
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: true
