title: discopt
author: John Kitchin
copyright: "2026, John Kitchin"
logo: discopt-logo.png
# Internal planning/design notes live under dev/ and design/; they are not book
# pages, so keep them out of the Sphinx source tree (otherwise every one warns
# "document isn't included in any toctree").
exclude_patterns:
  - dev
  - design
execute:
  execute_notebooks: "off"
repository:
  url: https://github.com/jkitchin/discopt
  branch: main
  path_to_book: docs
html:
  use_repository_button: true
  use_issues_button: true
sphinx:
  extra_extensions:
    - sphinx.ext.napoleon
    - sphinxcontrib.bibtex
    - autoapi.extension
  config:
    bibtex_bibfiles: ["references.bib"]
    bibtex_reference_style: author_year
    autoapi_dirs: ["../python/discopt"]
    autoapi_ignore: ["**/tests/**", "**/_rust*", "**/modeling/examples.py"]
    autoapi_options:
      - members
      - undoc-members
      - show-inheritance
      - show-module-summary
    napoleon_use_ivar: true
    autoapi_keep_files: false
    autoapi_add_toctree_entry: false
    # The in-browser docs assistant (docs/ask.md explains it to readers).
    # ask.js links ask.css itself, from alongside its own <script src>, so only
    # the script is listed here. Both are served out of _static/, and so is
    # ask-index.json -- but the index is NOT a source file: it is built from
    # the rendered HTML by scripts/build-docs-index.py as a post-build step,
    # because the anchors and URLs it cites only exist once Sphinx has run.
    # A build without that step leaves the panel searching nothing, which is
    # why `make docs` runs both and `make ask-check` guards the result.
    html_js_files:
      - ["ask.js", {"id": "discopt-ask"}]
    suppress_warnings:
      - etoc.toctree
      - myst.header
      - autoapi.python_import_resolution
