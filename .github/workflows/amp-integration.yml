name: AMP integration

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
  pull_request:
    # Same reason as ci.yml: PRs into a release branch need CI too.
    branches: [main, "release/**"]
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  schedule:
    - cron: "18 8 * * 1"

# Every Python test lane below builds the Rust extension with `maturin develop
# --release` and these two overrides, instead of the bare `maturin develop` they
# used to run.
#
# `maturin develop` with no profile flag builds `dev` — opt-level 0. The Makefile
# developers use locally builds `--release`, and so does graduation-gate.yml, so
# the Python lanes were the only place that ever exercised an unoptimized solver
# core; that is the real content of the comment on `python-correctness-slow`
# recording `python-correctness` as "~5 min locally and 23 min on a runner" and
# attributing the gap to the runner.
#
# Measured on an idle 4-vCPU/15 GB box (the runner's shape), interleaved A/B,
# `cargo test -p discopt-core -- --test-threads=4`, 2 reps each:
#
#   dev (what CI built)            113.57 s, 110.62 s   mean 112.10   646 tests
#   release (plain)                 12.91 s,  12.70 s   mean  12.80   645 tests
#   release + the two overrides     14.11 s,  14.11 s   mean  14.11   646 tests
#
# i.e. 7.9x faster than what CI was building, and the Python lanes are dominated
# by the same simplex/B&B kernels.
#
# The two overrides matter, and the test COUNT is why they are here rather than a
# bare `--release`: plain release drops to 645 because it compiles out the
# `#[cfg(debug_assertions)]` test in presolve/orchestrator.rs, and silences the 20
# `debug_assert!` invariant checks (index bounds, length agreement) in the
# simplex/B&B kernels plus integer overflow checking. Buying CI minutes by
# disarming a correctness check is the trade CLAUDE.md §1/§3 forbids. Arming them
# restores the 646th test and costs 1.3 s — 10% of an already 8x win. That count
# is the marker to assert on if this ever needs re-verifying.
#
# They go on the standard `release` profile (rather than a custom one in
# Cargo.toml) so the artifacts land in `target/release`, which is the path
# Swatinem/rust-cache is known to cache — a cache miss would cost more than the
# profile saves — and so nothing about the shipped wheels changes.
env:
  CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"

# This workflow had no concurrency group, so N pushes to main in quick
# succession each ran the full ~13 min Alpine/incidence suite to completion,
# including the runs whose SHA had already been superseded. ci.yml has cancelled
# superseded runs this way since it was written; this is the same rule.
# `schedule` and `workflow_dispatch` get their own group per run id so a manual
# or weekly run is never cancelled by a push.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  amp-integration:
    name: AMP Alpine/incidence suite
    # On PRs this suite is opt-in via the `amp-integration` label by default, to
    # avoid spending ~13 min of runner time on every PR. To catch AMP breakage
    # BEFORE it lands on main (the maintainer's stated pain point), set the repo
    # variable AMP_INTEGRATION_ON_ALL_PRS=true (Settings > Secrets and variables >
    # Actions > Variables) and the suite runs on every PR without a label. Push
    # to main and the scheduled run are always enabled.
    if: >-
      github.event_name != 'pull_request' ||
      vars.AMP_INTEGRATION_ON_ALL_PRS == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'amp-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Same reason as the ci.yml lanes: this suite now builds the optimized
      # `release` profile, so the cargo cache has to be here or the build cost eats
      # the speedup.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coinor-libipopt-dev liblapack-dev libblas-dev gfortran
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin
          pip install jax jaxlib numpy scipy highspy cyipopt pytest pytest-timeout pytest-xdist
          maturin develop --release
      - name: Verify cyipopt is importable
        run: |
          source .venv/bin/activate
          python -c "import cyipopt"
      # The AMP suite is split into two steps because two distinct failure modes
      # share one root cause: the in-house MILP B&B is pathologically slow on the
      # tan/abs cert instances (~24x nodes / 81% degenerate pivots vs HiGHS,
      # tracked in #606), and JAX/XLA reserves address space that the per-test
      # jax.clear_caches() fixture cannot return to the OS (only process death
      # does). Packed into one long-lived worker, later tests run under
      # accumulated XLA pressure that thrashes that already-slow B&B — a tan/abs
      # cert that finishes in ~seconds in a fresh interpreter blew past the 300s
      # harness timeout on the Linux runner (run 29126190059). So:
      #
      # STEP 1 (bulk, 186 tests): pytest-xdist -n 2 --dist=load. Spreading tests
      # across worker processes bounds per-process XLA accumulation to ~1/N so no
      # single interpreter degrades. -n 2 (not "auto") caps aggregate memory well
      # under the 16 GB runner; --dist=load (not loadscope) spreads individual
      # tests — the suite has no class/module/session-scoped fixtures, so per-test
      # distribution is safe, whereas loadscope would keep a whole heavy class on
      # one worker and re-accumulate. --forked (true per-test isolation) is NOT
      # usable: it INTERNALERRORs with pytest-timeout when a test runs to the
      # timeout, whereas xdist coordinates timeouts correctly.
      #
      # STEP 2 (cert, 4 tests, @pytest.mark.amp_cert_heavy): run SINGLE-PROCESS in
      # a fresh interpreter with a generous --timeout=900. A fresh process has no
      # accumulated XLA state, so the slow B&B runs at true speed (seconds, not
      # 300s+). These stay real gating tests (unweakened assertions:
      # status==optimal, gap_certified). This is deterministic — a fresh process
      # removes the accumulation mechanism entirely, it does not merely widen a
      # timeout budget and hope.
      - name: Run AMP integration suite — bulk (xdist, process-distributed)
        run: |
          source .venv/bin/activate
          scripts/run_memory_capped_pytest.sh pytest python/tests/test_amp_integration.py -v --timeout=300 -n 2 --dist=load -m "(slow or integration or amp_benchmark or requires_cyipopt or memory_heavy) and not amp_cert_heavy"
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
          # No prlimit --as cap: XLA reserves (but does not resident-commit) large
          # address-space regions, so a virtual-memory cap produces flaky
          # std::bad_alloc aborts (exit 134) unrelated to real RAM use. The
          # runner's kernel OOM-killer remains the safety net against a genuine
          # resident-memory runaway; per-worker distribution is the primary guard
          # against address-space accumulation.
          PYTEST_MEMORY_LIMIT_MB: "0"
      - name: Run AMP integration suite — heavy certification tests (isolated)
        if: always()
        run: |
          source .venv/bin/activate
          scripts/run_memory_capped_pytest.sh pytest python/tests/test_amp_integration.py -v --timeout=900 -p no:cacheprovider -m "(slow or integration or amp_benchmark or requires_cyipopt or memory_heavy) and amp_cert_heavy"
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
          PYTEST_MEMORY_LIMIT_MB: "0"

  # This suite failed on EVERY push to main from 2026-07-27 to 2026-08-08 — 40+
  # consecutive red runs — on a single test, with no issue tracking it. A red X
  # on a merge commit is not a signal if nothing routes it anywhere. One open
  # issue, reused rather than duplicated, is.
  report-failure:
    name: File/refresh the CI-signal issue
    needs: amp-integration
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh` resolves the repo from the git remote, and these reporter jobs
          # deliberately skip `actions/checkout` -- so every `gh` call died with
          # "fatal: not a git repository" and the reporter that exists to make a
          # failure visible failed silently itself. GH_REPO removes the git
          # dependency without paying for a checkout.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "CI signal down: AMP integration suite is failing on main"
        run: |
          set -euo pipefail
          gh label create ci-signal --force --color B60205 \
            --description "A CI lane that is supposed to be watching something has stopped watching"
          printf '%s\n' \
            "The AMP integration suite failed on \`${GITHUB_REF_NAME}\` (${GITHUB_SHA})." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "While this is red the AMP paths are unguarded on main." \
            > body.md
          NUM=$(gh issue list --state open --label ci-signal --json number,title \
                  --jq "[.[] | select(.title == env.TITLE)][0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file body.md
          else
            gh issue create --title "$TITLE" --label ci-signal --body-file body.md
          fi
