name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**", feature/mip-nlp-solver]
  pull_request:
    # `release/**` is here because a release branch accumulates PRs before it
    # merges to main (RELEASE.md §9). Without it those PRs get no CI at all,
    # and the release lands on main having been validated only as one big
    # merge — the opposite of what the checklist is for.
    branches: [main, "release/**", feature/mip-nlp-solver]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# NO `schedule:` trigger. A nightly re-run of the slow correctness lane is a
# ~2 h runner job every day against a SHA that has usually not moved, and the
# CI-minute cost is not worth it — the same judgement `143bd1e9` made when it
# removed the previous nightly ("duplicate work and the source of false-alarm
# emails"), and re-adding it in `23fff2a6` was a mistake. `python-correctness-slow`
# below is `workflow_dispatch`-only: run it deliberately, before a release or
# when touching the certificate path.

# Every Python test lane below builds the Rust extension with `maturin develop
# --release` and these two overrides, instead of the bare `maturin develop` they
# used to run.
#
# `maturin develop` with no profile flag builds `dev` — opt-level 0. The Makefile
# developers use locally builds `--release`, and so does graduation-gate.yml, so
# the Python lanes were the only place that ever exercised an unoptimized solver
# core; that is the real content of the comment on `python-correctness-slow`
# recording `python-correctness` as "~5 min locally and 23 min on a runner" and
# attributing the gap to the runner.
#
# Measured on an idle 4-vCPU/15 GB box (the runner's shape), interleaved A/B,
# `cargo test -p discopt-core -- --test-threads=4`, 2 reps each:
#
#   dev (what CI built)            113.57 s, 110.62 s   mean 112.10   646 tests
#   release (plain)                 12.91 s,  12.70 s   mean  12.80   645 tests
#   release + the two overrides     14.11 s,  14.11 s   mean  14.11   646 tests
#
# i.e. 7.9x faster than what CI was building, and the Python lanes are dominated
# by the same simplex/B&B kernels.
#
# The two overrides matter, and the test COUNT is why they are here rather than a
# bare `--release`: plain release drops to 645 because it compiles out the
# `#[cfg(debug_assertions)]` test in presolve/orchestrator.rs, and silences the 20
# `debug_assert!` invariant checks (index bounds, length agreement) in the
# simplex/B&B kernels plus integer overflow checking. Buying CI minutes by
# disarming a correctness check is the trade CLAUDE.md §1/§3 forbids. Arming them
# restores the 646th test and costs 1.3 s — 10% of an already 8x win. That count
# is the marker to assert on if this ever needs re-verifying.
#
# They go on the standard `release` profile (rather than a custom one in
# Cargo.toml) so the artifacts land in `target/release`, which is the path
# Swatinem/rust-cache is known to cache — a cache miss would cost more than the
# profile saves — and so nothing about the shipped wheels changes.
env:
  CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"

# Cancel superseded runs on the same PR/branch — saves CI minutes when
# pushes land in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether this push/PR touches anything that could affect solver
  # behavior. Docs-/results-/config-only changes skip the heavy test jobs
  # (rust / python-fast / python-amp-coverage) below. Deliberately conservative:
  # `code=true` unless EVERY changed file is in the docs/results allowlist, and
  # `true` on any uncertainty (empty diff, missing base) — we never skip tests on
  # doubt, because a core-solver change's blast radius is the whole corpus.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -uo pipefail
          # --- Cheap refusals before any diffing. Both are pure waste: a full
          # matrix costs ~56 min of runner time (measured on run 33263673485),
          # and these two events used to buy that every time.
          #
          # (1) DRAFT PRs. `synchronize` fires on every push to a draft, and an
          # agent-driven branch pushes many times before it is ready. `types:`
          # includes `ready_for_review`, so marking the PR ready runs the full
          # matrix on the final tree — the signal is deferred, never skipped, and
          # a draft cannot be merged in the meantime.
          #
          # (2) `labeled`/`unlabeled` events. Adding ANY label re-ran everything.
          # The only lanes that care about a label gate themselves on it
          # (`python-coverage` on `coverage`, the AMP suite on `amp-integration`)
          # and neither depends on this job, so they still fire; nothing else
          # should.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
              echo "code=false" >> "$GITHUB_OUTPUT"
              echo "=> code=false (draft PR: the full matrix runs on ready_for_review)"
              exit 0
            fi
            case "${{ github.event.action }}" in
              labeled|unlabeled)
                echo "code=false" >> "$GITHUB_OUTPUT"
                echo "=> code=false (label event: only the label-gated lanes run)"
                exit 0
                ;;
            esac
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A manual run is a request to run EVERYTHING — that is the only
            # reason to press the button. There is also no base to diff against:
            # `github.event.before` exists only on `push`, so the generic branch
            # below degenerated to `HEAD~1..HEAD` and answered as if only the tip
            # commit had changed. That is how a dispatch of this workflow came
            # back with rust / python-fast / claim-boundary / correctness / AMP
            # all `skipped` — nine checks that read as non-red while executing
            # nothing (found re-running #960; same genre as the #953 dark
            # signals). Never gate a manual run on a guessed diff.
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "=> code=true (workflow_dispatch: a manual run always runs everything)"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # No --depth: the checkout above is already `fetch-depth: 0`, and a
            # shallow fetch would install a boundary that hides the merge base of
            # any branch forked more than that many base commits back.
            git fetch --no-tags origin "${{ github.base_ref }}" || true
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || true)"
            # Same rule as the two branches around this one: an unresolvable base
            # is UNCERTAINTY, not a licence to guess. `${base:-HEAD~1}` used to
            # gate the whole matrix on the tip commit's file list, so a PR whose
            # tip happens to be docs-only skipped every solver job even when the
            # branch changes the solver — and `pull_request` is the trigger that
            # fires on nearly every change here. The `git fetch` above is
            # `|| true`, so this is reachable by a silent fetch failure alone.
            if [ -n "$base" ]; then
              changed="$(git diff --name-only "$base" HEAD 2>/dev/null || true)"
            else
              changed=""   # unknown base -> falls through to code=true below
              echo "no merge-base with origin/${{ github.base_ref }} -> treating as uncertain"
            fi
          else
            # `push`: diff against the pushed-from commit. If it is unusable (an
            # all-zero SHA on a branch's first push, a force-push, a shallow
            # clone) do NOT substitute a guess — an unknown base is the
            # "uncertainty" case this job promises to resolve as `true`.
            before="${{ github.event.before }}"
            case "$before" in
              ""|*[!0-9a-f]*|0000000000000000000000000000000000000000) before="" ;;
            esac
            if [ -n "$before" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$before" "${{ github.sha }}" 2>/dev/null || true)"
            else
              changed=""   # unknown base -> falls through to code=true below
              echo "no usable base ('${{ github.event.before }}') -> treating as uncertain"
            fi
          fi
          echo "Changed files:"; printf '%s\n' "$changed"
          # Allowlist of paths that can NOT affect solver behavior (safe to skip).
          allow='^(docs/|reports/|discopt_benchmarks/results/|\.crucible/|\.claude/|.*\.md$|.*\.org$|codecov\.yml$|LICENSE$|\.gitignore$)'
          if [ -z "$changed" ]; then
            code=true                                   # unknown/empty -> run
          elif printf '%s\n' "$changed" | grep -qvE "$allow"; then
            code=true                                   # >=1 non-allowlisted file -> run
          else
            code=false                                  # every change is docs/results -> skip
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "=> code=$code (heavy test jobs will $([ "$code" = true ] && echo RUN || echo SKIP))"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo build -p discopt-core
      # Default features include `parallel` (rayon node loop).
      - run: cargo test -p discopt-core
      # The serial path is the correctness reference; keep it building and green
      # so it can't rot now that `parallel` is the default.
      - run: cargo test -p discopt-core --no-default-features
      - run: cargo clippy -p discopt-core -- -D warnings
      - run: cargo clippy -p discopt-core --no-default-features -- -D warnings
      # Determinism guard: the parallel and serial batch loops must explore a
      # bit-identical B&B tree. Run the knapsack bench under both feature sets
      # and diff everything except the mode banner and the wall-clock line
      # (node counts, pivot counts, and per-instance objectives must match).
      - name: Parallel ≡ serial tree equivalence
        run: |
          cargo run --release -q -p discopt-core --example par_bench \
            --no-default-features \
            | grep -vE '^mode:|^total wall:' > /tmp/par_bench_serial.txt
          cargo run --release -q -p discopt-core --example par_bench \
            | grep -vE '^mode:|^total wall:' > /tmp/par_bench_parallel.txt
          diff -u /tmp/par_bench_serial.txt /tmp/par_bench_parallel.txt \
            && echo "OK: parallel path explores an identical tree to serial"

  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Run the SAME hooks (and the pinned ruff/mypy versions + mypy
      # type-resolution deps) that developers run locally — .pre-commit-config.yaml
      # is the single source of truth, so the local and CI toolchains can never
      # drift. cargo-fmt is skipped here (the Rust job covers fmt; no Rust
      # toolchain on this runner).
      - name: pre-commit (ruff, ruff-format, mypy)
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: cargo-fmt
        with:
          extra_args: --all-files

  python-fast:
    name: Python fast (3.12, ubuntu)
    runs-on: ubuntu-latest
    needs: changes
    # `python-coverage` below runs the SAME pytest invocation as this job — same
    # test paths, same `-m` marker expression, same `--ignore`, same worker
    # count — plus test_amp.py and the optional-extra deps, i.e. a strict
    # superset, with coverage instrumentation on top. Adding a test path to one
    # of the two and not the other silently drops it from whichever event runs
    # the other job, so change them together. Whenever it runs (every push to main, and
    # any PR carrying the `coverage` label) this job was re-running that superset
    # for a second time on the same tree, for ~15 min of runner time that bought
    # no signal. Skip here and let the superset be the signal; on an ordinary PR
    # (no `coverage` label) `python-coverage` does NOT run and this job is the
    # only fast lane, exactly as before.
    if: >-
      needs.changes.outputs.code == 'true' &&
      github.event_name != 'push' &&
      !contains(github.event.pull_request.labels.*.name, 'coverage')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Match the workspace used by maturin so the cargo build cache hits.
          workspaces: ". -> target"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Install system dependencies (Ipopt)
        # Ipopt comes from the standard Ubuntu repos (coinor-libipopt-dev). The
        # pre-baked packages.microsoft.com (azure-cli) apt source is unrelated and
        # intermittently serves a bad Release file ("Clearsigned file isn't valid
        # ... NOSPLIT"), which reds the whole job on a transient network hiccup.
        # Drop that source (we don't use azure-cli), then retry update+install a
        # few times with backoff so a transient mirror blip can't fail the suite.
        # cyipopt tests auto-skip when Ipopt is absent (see conftest), so even a
        # total install failure degrades to SKIP rather than ERROR.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list || true
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              coinor-libipopt-dev liblapack-dev libblas-dev gfortran && break
            echo "apt attempt $i failed; retrying in $((i * 15))s..." >&2
            sleep $((i * 15))
          done
      - name: Cache uv pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml', 'Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            uv-${{ runner.os }}-py312-
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          uv pip install maturin
          uv pip install \
            jax jaxlib numpy scipy highspy cyipopt openpyxl scikit-learn pyyaml sympy \
            "pounce-solver @ git+https://github.com/jkitchin/pounce.git@main#subdirectory=python" \
            pytest pytest-timeout pytest-xdist
          maturin develop --release
      - name: Run pytest (PR-fast, parallel)
        run: |
          source .venv/bin/activate
          # Keep worker count bounded so fork CI does not multiply JAX
          # compilation and AMP relaxation memory unexpectedly.
          # --dist loadgroup keeps tests sharing a class on the same worker
          #   so xdist-incompatible fixtures stay serialized.
          # Coverage is intentionally dropped from the PR path — see the
          # `python-coverage` job (main pushes + the `coverage` label) instead.
          # That parenthetical used to read "nightly + label-triggered";
          # `python-coverage` has never had a schedule trigger.
          # The cert-tooling tests join this lane. `cert-baseline.jsonl` is the
          # §0.2.5 bound-neutrality reference every solver change is judged
          # against, and until #1134 NOTHING in CI exercised the code that
          # generates, validates or reads it: ci.yml pulled exactly one file out
          # of discopt_benchmarks/tests, so both cert modules could only ever be
          # run by hand. This one is unmarked and lands here; its sibling
          # `test_cert_neutrality_regime.py` is `pytest.mark.correctness` and
          # would collect ZERO tests under this lane's `not correctness`, so it
          # joins `python-correctness` instead. Both are pure functions over the
          # committed reference — no solve, no .nl file, numpy their only
          # third-party import — so they cost ~a second and cannot flake on a
          # runner's wall clock.
          scripts/run_memory_capped_pytest.sh pytest python/tests/ \
            discopt_benchmarks/tests/test_1134_cert_baseline_shrink_guard.py \
            -q --tb=short --timeout=120 \
            -m "not slow and not correctness and not integration and not amp_benchmark and not requires_cyipopt and not memory_heavy" \
            --ignore=python/tests/test_correctness.py \
            --ignore=python/tests/test_amp.py \
            -n "${PYTEST_XDIST_WORKERS}" --dist loadgroup \
            --durations=20
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
          PYTEST_MEMORY_LIMIT_MB: "32768"
          PYTEST_XDIST_WORKERS: "2"

  python-correctness:
    # Fast-correctness lane: runs the `correctness`-marked tests that are NOT
    # `slow` on every PR. The `python-fast` job deliberately EXCLUDES the
    # `correctness` marker (and `--ignore`s test_correctness.py), so a soundness
    # regression in a fast known-optima test could — and did — merge silently:
    # #248's nvs16 garbage-bound guard regressed at the #632 uniform-relax cutover
    # and sat unnoticed for a full release cycle because no PR job ran the
    # `correctness` marker. This lane closes that gap. It runs only the cheap
    # subset (`not slow`); the `slow` half is `python-correctness-slow` below,
    # which is manual-dispatch only — no automatic lane runs it, by design
    # (see the `on:` block: a nightly costs more CI minutes than it is worth).
    # Running it is therefore a deliberate act before a release or after a
    # change to the certificate path, and its 153 `slow`+`correctness` tests
    # have no continuous watch. That is a known, accepted gap; #927 (ex1252
    # dual-bound soundness) is one of the things it would have caught.
    name: Python correctness (fast subset, 3.12, ubuntu)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Match the workspace used by maturin so the cargo build cache hits.
          workspaces: ". -> target"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Install system dependencies (Ipopt)
        # See the python-fast job for why the microsoft/azure-cli apt source is
        # dropped and the install is retried with backoff.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list || true
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              coinor-libipopt-dev liblapack-dev libblas-dev gfortran && break
            echo "apt attempt $i failed; retrying in $((i * 15))s..." >&2
            sleep $((i * 15))
          done
      - name: Cache uv pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml', 'Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            uv-${{ runner.os }}-py312-
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          uv pip install maturin
          uv pip install \
            jax jaxlib numpy scipy highspy cyipopt openpyxl scikit-learn pyyaml sympy \
            "pounce-solver @ git+https://github.com/jkitchin/pounce.git@main#subdirectory=python" \
            pytest pytest-timeout pytest-xdist
          maturin develop --release
      - name: Run pytest (fast correctness, serial)
        run: |
          source .venv/bin/activate
          # The bare `-m "correctness and ..."` deliberately OVERRIDES the
          # pyproject `addopts` marker expression (which deselects `correctness`)
          # so the fast known-optima tests DO run here. `not slow` keeps the lane
          # PR-cheap; the excluded markers mirror python-fast so the heavy/env-
          # dependent suites stay on their own jobs. test_correctness.py is NOT
          # ignored here (unlike python-fast) — it is the point of this lane.
          # Run SERIALLY (no xdist): a soundness lane must be deterministic, and
          # some correctness tests validate global/claim state that xdist can
          # order-mask (the same reason python-claims-serial runs -n0). The subset
          # is ~5 min serially (287 tests locally), so determinism costs little.
          # discopt_benchmarks/tests/test_correctness.py joins this lane: it is
          # the repo's only run-to-run reproducibility assertion (TestDeterminism,
          # the consumer of #1116's `deterministic=`) and it lived its whole life
          # skipping. It resolves instances from python/tests/data/minlplib_nl/,
          # which is in the checkout, and skips the ones that are not.
          # test_cert_neutrality_regime.py joins for the same reason as #1134's
          # shrink-guard module joins python-fast: it is `correctness`-marked, so
          # this is the only lane whose marker expression selects it, and until
          # now nothing in CI ran it at all.
          scripts/run_memory_capped_pytest.sh pytest python/tests/ \
            discopt_benchmarks/tests/test_correctness.py \
            discopt_benchmarks/tests/test_cert_neutrality_regime.py \
            -q --tb=short --timeout=120 -p no:cacheprovider \
            -m "correctness and not slow and not integration and not amp_benchmark and not requires_cyipopt and not memory_heavy" \
            --ignore=python/tests/test_amp.py \
            --durations=20
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
          PYTEST_MEMORY_LIMIT_MB: "32768"

  python-correctness-slow:
    # The other half of the correctness marker: the 153 tests that are `slow`
    # AND `correctness`. These are the end-to-end known-optima and soundness
    # assertions — the ones that solve a real instance and check the certificate
    # against `minlplib.solu`. Manual dispatch only: hours rather than minutes,
    # so it is neither a PR lane nor a nightly (see the `on:` block). The
    # `not slow` half stays on `python-correctness` for the PR-fast signal.
    #
    # Serial for the same reason as `python-correctness`: a soundness lane must
    # be deterministic, and xdist can order-mask global/claim state.
    #
    # `--timeout=1800` because these tests pass real `time_limit=` / `deadline=`
    # budgets to the solver and a per-test timeout below the budget would fail the
    # harness instead of the assertion. Raised from 900 s: the two ex1252
    # disjunctive-config bars are budget-bound (`max_leaf_solves` 48 and 120), and
    # their deadlines are backstops sized ~2x the measured runner rate (this runner
    # manages ~0.175 leaf solves/s, so 48 leaves ~275 s and 120 leaves ~690 s;
    # the deadlines are 600 s and 1500 s). The 120 min job timeout is the real
    # backstop against a hang — the per-test timeout must not be what decides a
    # quality bar, because then the bar measures the runner. See
    # `_assert_budget_not_clock` in test_disjunctive_config_bound.py.
    #
    # Measured 313 s serially on an M-series laptop (153 selected: 146 passed,
    # 7 skipped, 1 failed — the failure being #927). This used to add that
    # `python-correctness` is "~5 min locally and 23 min on a runner", and budget
    # from that as if a slower runner explained the 4.6x. RETRACTED: the gap was
    # the build profile, not the machine. Local runs go through the Makefile,
    # which builds `maturin develop --release`; every lane here built a bare
    # `maturin develop`, i.e. opt-level 0. See the `env:` block at the top of this
    # file for the A/B (112.10 s -> 14.11 s on `cargo test`, same box). All lanes
    # now build optimized, so the runner-vs-laptop ratio is back to something like
    # the CPU ratio. The 120 min job timeout stays as the hang backstop.
    name: Python correctness (slow, on demand, 3.12, ubuntu)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Install system dependencies (Ipopt)
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list || true
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              coinor-libipopt-dev liblapack-dev libblas-dev gfortran && break
            echo "apt attempt $i failed; retrying in $((i * 15))s..." >&2
            sleep $((i * 15))
          done
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          uv pip install maturin
          uv pip install \
            jax jaxlib numpy scipy highspy cyipopt openpyxl scikit-learn pyyaml sympy \
            "pounce-solver @ git+https://github.com/jkitchin/pounce.git@main#subdirectory=python" \
            pytest pytest-timeout pytest-xdist
          maturin develop --release
      - name: Run pytest (slow correctness, serial)
        run: |
          source .venv/bin/activate
          # `-v` and `python -u` are deliberate: a multi-hour job that only
          # prints a summary at the end cannot be distinguished from a hung one
          # (CLAUDE.md §10).
          scripts/run_memory_capped_pytest.sh pytest python/tests/ \
            -v --tb=short --timeout=1800 -p no:cacheprovider \
            -m "correctness and slow and not integration and not amp_benchmark and not requires_cyipopt and not memory_heavy" \
            --ignore=python/tests/test_amp.py \
            --durations=25
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
          PYTHONUNBUFFERED: "1"
          PYTEST_MEMORY_LIMIT_MB: "32768"

  # Same argument as the other two scheduled lanes: a lane that fails into an
  # empty room is not a signal. This one is now dispatch-only, and a dispatched
  # 2 h run is exactly the kind you walk away from, so the report still earns
  # its place. It is NOT gated on `github.event_name` — the lane above has only
  # one trigger left, and gating on a trigger that can no longer fire is how
  # `23fff2a6` shipped three reporters that never reported.
  report-slow-correctness-failure:
    name: File/refresh the CI-signal issue
    needs: python-correctness-slow
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh` resolves the repo from the git remote, and these reporter jobs
          # deliberately skip `actions/checkout` -- so every `gh` call died with
          # "fatal: not a git repository" and the reporter that exists to make a
          # failure visible failed silently itself. GH_REPO removes the git
          # dependency without paying for a checkout.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "CI signal down: slow-correctness lane is failing"
        run: |
          set -euo pipefail
          gh label create ci-signal --force --color B60205 \
            --description "A CI lane that is supposed to be watching something has stopped watching"
          printf '%s\n' \
            "The \`slow\`+\`correctness\` lane failed." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "These are the end-to-end certificate assertions. A failure here is a" \
            "soundness signal until shown otherwise — triage before merging work" \
            "that touches the same layer." \
            > body.md
          NUM=$(gh issue list --state open --label ci-signal --json number,title \
                  --jq "[.[] | select(.title == env.TITLE)][0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file body.md
          else
            gh issue create --title "$TITLE" --label ci-signal --body-file body.md
          fi

  python-claims-serial:
    # Relaxation claim-arbitration tests, run SERIALLY (-n0). The federated
    # lifted-relaxation "claimers" are arbitrated by a hand-maintained defer-list
    # whose collisions are order-masked under pytest-xdist: a test can pass under
    # `-n 2 --dist loadgroup` (leaker and victim land in different workers) yet
    # fail serially / in CI. The `python-fast` job cannot catch that class. This
    # job runs the `claim_boundary`-marked set in a single process, in file order,
    # so a silent divert cannot hide (issue #632). The bare `-m claim_boundary`
    # deliberately overrides pyproject `addopts` so the slow/correctness-marked
    # claim tests DO run here.
    name: Python claim-boundary (serial, 3.12, ubuntu)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          uv pip install maturin
          uv pip install \
            jax jaxlib numpy scipy highspy openpyxl scikit-learn pyyaml sympy \
            "pounce-solver @ git+https://github.com/jkitchin/pounce.git@main#subdirectory=python" \
            pytest pytest-timeout pytest-xdist
          maturin develop --release
      - name: Run pytest (claim-boundary, serial)
        run: |
          source .venv/bin/activate
          scripts/run_memory_capped_pytest.sh pytest python/tests/ \
            -q --tb=short --timeout=600 \
            -m claim_boundary \
            -p no:cacheprovider -n0 \
            --durations=20
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
          PYTEST_MEMORY_LIMIT_MB: "32768"

  python-coverage:
    name: Python coverage (3.12, ubuntu)
    # Run coverage on main pushes, or on PRs explicitly opted in
    # via the `coverage` label.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'coverage'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Install system dependencies (Ipopt)
        # Same hardening as the python-fast job: drop the unrelated, flaky
        # packages.microsoft.com apt source and retry update+install with backoff.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list || true
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              coinor-libipopt-dev liblapack-dev libblas-dev gfortran && break
            echo "apt attempt $i failed; retrying in $((i * 15))s..." >&2
            sleep $((i * 15))
          done
      - name: Cache uv pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py312-cov-${{ hashFiles('pyproject.toml', 'Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            uv-${{ runner.os }}-py312-cov-
      - name: Install Python dependencies
        # The optional-feature deps (sympy, pyomo, equinox/optax, onnx stack,
        # litellm, xgboost, lightgbm) are installed here so the coverage gate
        # measures the modules they unlock (symbolic envelopes, the Pyomo
        # bridge, GNN branching, NN embedding readers, LLM helpers) with their
        # existing fast tests instead of skipping them (#87). Keep this list in
        # sync with the optional extras in pyproject.toml.
        run: |
          python -m venv .venv
          source .venv/bin/activate
          uv pip install maturin
          uv pip install \
            jax jaxlib numpy scipy highspy cyipopt openpyxl scikit-learn pyyaml \
            "pounce-solver @ git+https://github.com/jkitchin/pounce.git@main#subdirectory=python" \
            sympy pyomo litellm equinox optax onnx onnxruntime xgboost lightgbm \
            pytest pytest-timeout pytest-xdist pytest-cov
          maturin develop --release
      # --cov-fail-under restored to 85 (#87) after the post-AMP-merge
      # 85 -> 70 -> 65 lowering: the optional-dep unlock plus the
      # property-test batteries measured 85.50% with this job's exact
      # command and marker set (see the #87 PR for the run log).
      - name: Run pytest with coverage
        run: |
          source .venv/bin/activate
          # Kept a strict superset of `python-fast` (see that job's comment):
          # the cert-tooling tests are added HERE TOO, or they would silently
          # stop running on every push to main, which is the only event that
          # skips python-fast.
          scripts/run_memory_capped_pytest.sh pytest python/tests/ \
            discopt_benchmarks/tests/test_1134_cert_baseline_shrink_guard.py \
            -q --tb=short --timeout=120 \
            -m "not slow and not correctness and not integration and not amp_benchmark and not requires_cyipopt and not memory_heavy" \
            --ignore=python/tests/test_correctness.py \
            -n "${PYTEST_XDIST_WORKERS}" --dist loadgroup \
            --cov=discopt --cov-report=term-missing --cov-report=xml:coverage.xml \
            --cov-fail-under=85
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
          PYTEST_MEMORY_LIMIT_MB: "32768"
          PYTEST_XDIST_WORKERS: "2"
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  python-amp-coverage:
    name: Python AMP coverage (3.12, ubuntu)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # This lane was the only Python job with no cargo cache. That was cheap
      # while it built the unoptimized `dev` profile; now that it builds the
      # optimized `release` profile like every other lane, an uncached compile would
      # cost more than the profile saves.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin
          # pounce-solver matches the other four lanes. It was missing here, which
          # was invisible while the tape NLP evaluator was opt-in and became a hard
          # failure the moment it graduated to default-ON (#75): every solve raised
          # ModuleNotFoundError. discopt now degrades to the JAX evaluator when
          # POUNCE is absent, so this lane would pass either way — but it should
          # exercise the same backend as everything else, not the fallback.
          pip install jax jaxlib numpy scipy highspy pytest pytest-timeout pytest-cov "ruff==0.14.6" \
            "pounce-solver @ git+https://github.com/jkitchin/pounce.git@main#subdirectory=python"
          maturin develop --release
      - name: Test AMP fast battery with coverage
        run: |
          source .venv/bin/activate
          scripts/run_memory_capped_pytest.sh pytest python/tests/test_amp.py -v --timeout=120 -m "not slow and not integration and not amp_benchmark and not requires_cyipopt and not memory_heavy" --cov=discopt --cov-report=term-missing --cov-report=xml:coverage-amp.xml
        env:
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "1"
          PYTEST_MEMORY_LIMIT_MB: "32768"
      - name: Upload AMP coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage-amp.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
