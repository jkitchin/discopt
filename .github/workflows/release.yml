name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # One abi3 wheel per platform covers every supported interpreter --
          # see the abi3-py312 note in Cargo.toml. No `-i` list: an explicit
          # interpreter list here would silently define coverage per platform,
          # which is exactly how #1055 happened.
          args: --release --out dist
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-14
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Install each built wheel on a NATIVE runner of its platform and solve an LP and a
  # MILP on the HiGHS route. highspy is a core dependency (#1229): a wheel whose
  # highspy requirement does not resolve there must fail the release, not the user.
  # The build jobs cross-compile (aarch64 on x86_64, x86_64 on arm64 macOS), so they
  # cannot run what they build -- hence a separate job per native runner.
  wheel-smoke:
    needs: [linux, macos, windows]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: wheels-linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact: wheels-linux-aarch64
          - runner: macos-15-intel
            artifact: wheels-macos-x86_64
          - runner: macos-14
            artifact: wheels-macos-aarch64
          - runner: windows-latest
            artifact: wheels-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the wheel in a fresh venv and solve on the HiGHS route
        shell: bash
        run: |
          # The venv lives OUTSIDE the checkout and is named by an absolute
          # path. Both halves are load-bearing, and each was learned from a
          # failed v0.9.0 release run:
          #   - absolute, because the `cd` below leaves the checkout; a relative
          #     interpreter path stops resolving and the job dies with exit 127
          #     before wheel_smoke.py ever runs (run 36046289966);
          #   - outside the checkout, because wheel_smoke.py rejects a discopt
          #     imported from under the repo root -- putting the venv inside the
          #     checkout makes site-packages a subdirectory of it and trips that
          #     provenance guard (run 36049766106).
          venv="$RUNNER_TEMP/smoke-venv"
          python -m venv "$venv"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$venv/Scripts/python.exe"; else PY="$venv/bin/python"; fi
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then echo "expected one wheel, got: ${wheels[*]}"; exit 1; fi
          "$PY" -m pip install "${wheels[0]}"
          # Run from outside the checkout so `import discopt` cannot resolve to ./python.
          cd "$RUNNER_TEMP"
          "$PY" "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist, wheel-smoke]
    environment:
      name: pypi
      url: https://pypi.org/p/discopt
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # Green build jobs are not evidence of coverage: v0.8.0 published with
      # eight of twelve platform/version combinations missing and every job
      # passed. Check the artifact list itself, before the upload.
      - name: Verify wheel coverage
        run: python .github/scripts/check_wheel_coverage.py dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          skip-existing: true
