name: Docs

on:
  push:
    branches: [main]
    # The site is built from docs/ and the autoapi-generated API pages, so a push
    # that touches neither cannot change it. Without this the book was rebuilt —
    # jax/jaxlib install plus a full jupyter-book build — on every merge to main,
    # including Rust-only and benchmark-results-only merges.
    paths:
      - "docs/**"
      - "python/discopt/**"
      - "crates/discopt-wasm/**"
      - ".github/workflows/docs.yml"
  # Keep a manual button so the site can be republished without a docs commit
  # (e.g. after a Pages settings change or a failed deploy).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install "jupyter-book<2" sphinxcontrib-bibtex sphinx-autoapi
          pip install jax jaxlib numpy scipy
          pip install playwright && playwright install --with-deps chromium
      - name: Build Jupyter Book
        run: jupyter-book build docs/
      # The docs assistant's search index is NOT a source file: it is built from
      # the rendered HTML, because the anchors and URLs it cites only exist once
      # Sphinx has run (docs/ask.md, "For maintainers"). `make docs` has always
      # run both steps; this workflow ran only the first, so every site this job
      # ever published served a panel whose index 404s -- search-only mode with
      # nothing to search, on a shipped feature. The builder exits non-zero on
      # zero pages, zero chunks or zero anchored chunks, so an index that built
      # but indexed nothing cannot pass here either.
      - name: Build the docs-assistant search index
        run: python scripts/build-docs-index.py
      # `make ask-check` minus the rebuild it just did. The retrieval half needs
      # only node; the browser half is what would have caught the shape of the
      # bug above, since it asserts the index is fetched AND served 200 from the
      # same nested-page layout a reader gets.
      - name: Guard the docs assistant
        run: |
          node docs/tests/ask_retrieval.mjs docs/_build/html/_static/ask-index.json
          python docs/tests/ask_e2e.py
      # The in-browser solver page. It is static -- HTML, two ES modules, a
      # vendored CodeMirror bundle and two emscripten wheels -- so staging it is
      # a copy, not a build.
      #
      # The wheels are COMMITTED rather than built here. Building one needs
      # Pyodide's patched emsdk, a Rust nightly and a wasm-EH sysroot, roughly a
      # gigabyte of toolchain, which is not worth carrying on a docs run; see
      # crates/discopt-wasm/build-wheel.sh. The trade is that a stale or missing
      # wheel would be invisible from here, so it is asserted below instead:
      # without these tests a visitor is the one who discovers that `import
      # discopt` fails on the live page.
      #
      # One build from main, not one per tag: the page is the current solver,
      # and an archived copy per release would be a fleet of pages quietly
      # serving old wheels.
      - name: Check the staged wasm wheels
        run: crates/discopt-wasm/build-wheel.sh --check
      - name: Stage the in-browser solver page
        run: |
          set -euo pipefail
          site="docs/_build/html/wasm"
          mkdir -p "$site"
          cp -a crates/discopt-wasm/web/. "$site/"
          find "$site" -name .gitignore -delete
          # Named explicitly rather than globbed: a glob that matches nothing
          # succeeds, which is the failure this step exists to prevent.
          test -s "$site/index.html"
          test -s "$site/app.js"
          test -s "$site/worker.js"
          test -s "$site/examples.js"
          test -s "$site/vendor/codemirror.bundle.js"
          test -s "$site/wheels/discopt-wheel.json"
          test -s "$site/wheels/pounce-wheel.json"
          # And the manifests must name wheels that actually arrived -- copying
          # a manifest without its wheel is exactly how this breaks.
          python - "$site" <<'PY'
          import json, pathlib, sys
          site = pathlib.Path(sys.argv[1])
          checked = 0
          for manifest in sorted((site / "wheels").glob("*-wheel.json")):
              wheel = site / "wheels" / json.loads(manifest.read_text())["wheel"]
              assert wheel.is_file() and wheel.stat().st_size > 0, wheel
              print(f"  {wheel.name}  {wheel.stat().st_size} bytes")
              checked += 1
          assert checked == 2, f"expected 2 staged wheels, found {checked}"
          print(f"staged wheels verified: {checked}")
          PY
      # Static checks cannot see this class of failure. Both browser bugs found
      # while building the page -- LP/MILP dying on a missing highspy, and MIQP
      # dying on a Rayon pool that cannot exist without pthreads -- were
      # invisible to pytest and to every assertion above, because they need a
      # real Pyodide interpreter with these exact wheels in it. So the staged
      # site is served and the six examples are actually solved.
      - name: Solve the examples under real Pyodide
        run: |
          set -euo pipefail
          npm --prefix crates/discopt-wasm/tests ci
          python -m http.server -d docs/_build/html/wasm 8731 &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 30); do
            curl -sfo /dev/null http://localhost:8731/wheels/discopt-wheel.json && break
            sleep 1
          done
          node crates/discopt-wasm/tests/examples_in_pyodide.mjs http://localhost:8731
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
