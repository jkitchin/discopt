name: Docs

on:
  push:
    branches: [main]
    # The site is built from docs/ and the autoapi-generated API pages, so a push
    # that touches neither cannot change it. Without this the book was rebuilt —
    # jax/jaxlib install plus a full jupyter-book build — on every merge to main,
    # including Rust-only and benchmark-results-only merges.
    paths:
      - "docs/**"
      - "python/discopt/**"
      - ".github/workflows/docs.yml"
  # Keep a manual button so the site can be republished without a docs commit
  # (e.g. after a Pages settings change or a failed deploy).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install "jupyter-book<2" sphinxcontrib-bibtex sphinx-autoapi
          pip install jax jaxlib numpy scipy
          pip install playwright && playwright install --with-deps chromium
      - name: Build Jupyter Book
        run: jupyter-book build docs/
      # The docs assistant's search index is NOT a source file: it is built from
      # the rendered HTML, because the anchors and URLs it cites only exist once
      # Sphinx has run (docs/ask.md, "For maintainers"). `make docs` has always
      # run both steps; this workflow ran only the first, so every site this job
      # ever published served a panel whose index 404s -- search-only mode with
      # nothing to search, on a shipped feature. The builder exits non-zero on
      # zero pages, zero chunks or zero anchored chunks, so an index that built
      # but indexed nothing cannot pass here either.
      - name: Build the docs-assistant search index
        run: python scripts/build-docs-index.py
      # `make ask-check` minus the rebuild it just did. The retrieval half needs
      # only node; the browser half is what would have caught the shape of the
      # bug above, since it asserts the index is fetched AND served 200 from the
      # same nested-page layout a reader gets.
      - name: Guard the docs assistant
        run: |
          node docs/tests/ask_retrieval.mjs docs/_build/html/_static/ask-index.json
          python docs/tests/ask_e2e.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
